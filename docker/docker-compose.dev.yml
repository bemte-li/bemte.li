services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3030:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_POCKETBASE_URL=http://localhost:8090
      - POCKETBASE_INTERNAL_URL=http://pocketbase:8090
    networks:
      - web

  pocketbase:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    ports:
      - "8090:8090"
    volumes:
      - backend_go_mod_cache:/go/pkg/mod
      - backend_tmp:/app/tmp
      - ../backend:/app
      - ../backend/pb_data:/app/pb_data
      - ../backend/migrations:/app/migrations
    env_file:
      - .env.development
    environment:
      - APP_ENV=development
    networks:
      - web
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://0.0.0.0:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  smtp4dev:
    image: rnwood/smtp4dev:latest
    ports:
      - "8025:80"   # Web UI
      - "25:25"     # SMTP
      - "143:143"   # IMAP
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__BasePath=/
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev
      - ServerOptions__NumberOfMessagesToKeep=100
      - ServerOptions__NumberOfSessionsToKeep=100
    networks:
      - web

volumes:
  smtp4dev-data:
  frontend_node_modules:
  backend_go_mod_cache:
  backend_tmp:

networks:
  web:
    driver: bridge
